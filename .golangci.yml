# golangci-lint configuration (schema v2).
#
# Scoped to high-signal detectors that catch REAL defects on THIS codebase. Every
# finding was triaged individually against the current tree (not baselined): real
# ones were fixed, and each remaining suppression is either a per-site
# `//nolint:gosec` with a stated reason at the call site, or a narrowly scoped
# rule below with its rationale. There is NO blanket linter disable.
version: "2"

linters:
  # `standard` = govet, staticcheck, errcheck, ineffassign, unused.
  default: standard
  enable:
    - gosec         # security scanner; every finding triaged (see below + per-site //nolint).
    - bodyclose     # HTTP response bodies must be closed (real leak class).
    - errorlint     # correct error comparison/wrapping (errors.Is/As).
    - misspell      # typos in comments and strings.
    - unconvert     # redundant type conversions.
  settings:
    errcheck:
      # errcheck is ENABLED (2026-08-08 re-triage). The only findings excluded are
      # unchecked writes to an io.Writer via the fmt.Fprint* family — writing to
      # stdout / a cobra command's output stream, where a write error is neither
      # recoverable nor actionable at the call site. Every OTHER unchecked error
      # (including deferred Close/Remove) is caught; the three that existed were
      # fixed in code (explicit `_ =`), not excluded.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    generated: lax
    rules:
      # Determinism tests deliberately call the same pure function twice and
      # assert the results are byte-identical (f(x) != f(x) as a nondeterminism
      # probe). staticcheck's SA4000 "identical expressions" cannot see the
      # intent; suppress it only in these two determinism tests.
      - path: internal/apiserver/handler_test.go
        text: "SA4000"
        linters:
          - staticcheck
      - path: internal/okf/reserved_lifecycle_test.go
        text: "SA4000"
        linters:
          - staticcheck
      # This is a multi-line, user-facing CLI guidance message printed verbatim,
      # not a wrapped error fragment; the trailing period and embedded newlines
      # are intentional formatting. ST1005 assumes error strings get concatenated.
      - path: cmd/node.go
        text: "ST1005"
        linters:
          - staticcheck
      # gosec on TEST files only (2026-08-08 re-triage). Every gosec finding in
      # production code is fixed or carries a per-site `//nolint:gosec` with a
      # reason. In _test.go the residue is 179 findings of one benign class:
      # test scaffolding under t.TempDir() — G301/G306 (0o755/0o644 fixture
      # perms), G304 (reading fixtures the test just wrote), G204 (git run with
      # fixed args in a throwaway repo). None touch shipped code paths; annotating
      # 179 sites would bury the test suite in noise for zero security value, so
      # gosec is scoped OUT of test files here rather than suppressed per line.
      # gosec stays FULLY ENFORCING on all production code — this is a
      # test-file scope, not a linter disable.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
