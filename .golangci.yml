# golangci-lint configuration (schema v2).
#
# Deliberately scoped to high-signal, low-false-positive detectors that catch
# REAL defects on THIS codebase — not the everything-firehose that produces
# hundreds of findings nobody triages. Each linter below was verified against the
# current tree; genuine findings were fixed rather than suppressed, and the few
# suppressions here are documented false positives, not baselined bugs.
#
# Left out on purpose (measured, not guessed):
#   - errcheck: 15 findings, every one idiomatic unchecked fmt.Fprint* to stdout
#     or `defer x.Close()` — not defects, and forcing `_ =` everywhere is exactly
#     the noise diff this scoping avoids.
#   - gosec: 18 findings, all non-security patterns on this tool (dev-server
#     ListenAndServe, git subprocess, feature-hashing SHA1, local file perms).
#     Enabling it means a wall of //nosec annotations, not safer code.
#   - unparam / revive(unused-parameter): 8 findings, all unused test-helper
#     params — noise, not defects.
version: "2"

linters:
  # `standard` = govet, staticcheck, errcheck, ineffassign, unused.
  # errcheck is disabled below (see rationale above); the rest are kept.
  default: standard
  disable:
    - errcheck
  enable:
    - bodyclose      # HTTP response bodies must be closed (real leak class).
    - errorlint      # correct error comparison/wrapping (errors.Is/As).
    - misspell       # typos in comments and strings.
    - unconvert      # redundant type conversions.
  exclusions:
    generated: lax
    rules:
      # Determinism tests deliberately call the same pure function twice and
      # assert the results are byte-identical (f(x) != f(x) as a nondeterminism
      # probe). staticcheck's SA4000 "identical expressions" cannot see the
      # intent; suppress it only in these two determinism tests.
      - path: internal/apiserver/handler_test.go
        text: "SA4000"
        linters:
          - staticcheck
      - path: internal/okf/reserved_lifecycle_test.go
        text: "SA4000"
        linters:
          - staticcheck
      # SA5011 (possible nil deref) false-positives in tests using the standard
      # `if x == nil { t.Fatalf(...) }` guard: staticcheck does not model
      # t.Fatalf as terminating the goroutine (it calls runtime.Goexit, not
      # panic/os.Exit), so it flags the guaranteed-non-nil use after the guard.
      - path: _test\.go
        text: "SA5011"
        linters:
          - staticcheck
      # This is a multi-line, user-facing CLI guidance message printed verbatim,
      # not a wrapped error fragment; the trailing period and embedded newlines
      # are intentional formatting. ST1005 assumes error strings get concatenated.
      - path: cmd/node.go
        text: "ST1005"
        linters:
          - staticcheck

formatters:
  enable:
    - gofmt
