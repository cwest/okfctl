# repo:managed
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # The three github/codeql-action/* pins share one SHA and must move
      # together; a per-action split yields mutually-broken PRs that run
      # mismatched CodeQL versions. Keep them in one PR.
      codeql-action:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # One PR for all Go module updates instead of a per-module storm.
      go-modules:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    groups:
      site-npm:
        patterns:
          - "*"
