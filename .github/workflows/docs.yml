name: docs
on:
  push: { branches: [main] }
  release: { types: [published] }
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  # A release publish runs this workflow at the TAG ref (refs/tags/vX.Y.Z). The
  # github-pages environment permits deployments only from `main`, so a deploy
  # attempted from a tag is rejected by environment protection (1s / 0 steps).
  # Instead of attempting an env-rejected deploy from the tag, re-dispatch this
  # workflow on `main`, which re-enters via workflow_dispatch at an env-permitted
  # ref and performs the real build+deploy with a freshly-read version chip. This
  # is the automated form of the manual workflow_dispatch rerun that was
  # previously required after each release.
  redispatch:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: rebuild docs on main
        run: gh workflow run docs.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: install
        run: npm ci --prefix site
      - name: build
        # The build's prebuild step templates the CI-proven command reference
        # (docs/commands/README.md) into the site; the version snippet derives
        # from the GitHub releases API. GITHUB_TOKEN raises that call's rate
        # limit but is optional.
        run: npm run build --prefix site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The GA4 measurement id (G-XXXXXXXXXX). Referenced as a repo VARIABLE,
          # not a secret: a measurement id ships in public client HTML and is not
          # a credential, so masking it as a secret would only break a build that
          # prints it (***) while protecting nothing. src/lib/analytics.ts gates
          # the tag on this being set AND a production build, so an empty/missing
          # value degrades to no-tag — a fork building without the variable still
          # gets a clean build.
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist
  deploy:
    if: github.event_name != 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: github-pages
    # Only the deploy holds the single-in-flight Pages lock. A newer deploy
    # supersedes an in-flight one rather than erroring on the environment's
    # one-deployment-per-environment rule.
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
