name: ci
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  # Detect which parts of the tree a PR touches so the site build can skip its
  # expensive steps on Go-only PRs. The `site` job still always runs (so it can
  # serve as a required status check) — only its install/build steps are gated.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      site: ${{ steps.filter.outputs.site }}
      skills: ${{ steps.filter.outputs.skills }}
      prose: ${{ steps.filter.outputs.prose }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            site:
              - 'site/**'
              - 'docs/**'
            skills:
              - 'skills/**'
              - 'cmd/**'
              - '.github/workflows/ci.yml'
              - 'scripts/skill-command-contract.sh'
            prose:
              - 'README.md'
              - 'CONTRIBUTING.md'
              - 'docs/**/*.md'
              - 'site/scripts/scan_page_prose.py'
              - 'site/scripts/scan_page_prose_test.py'
              - '.github/workflows/ci.yml'

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.26.6' }
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: build
        run: CGO_ENABLED=0 go build ./...
      - name: test
        run: go test ./... -race
      - name: govulncheck
        # Fails the build on a known CVE in the module graph or the toolchain.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.26.6' }
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  # Bounded fuzz pass over the untrusted-input parsers (frontmatter, node/
  # Markdown link scanning, apiserver query params). Each target runs a short
  # -fuzztime so a regression that introduces a crasher surfaces on the PR
  # without making the build slow. `go test -fuzz` runs exactly ONE target per
  # package invocation, so the targets are listed explicitly. The committed
  # testdata/fuzz seed corpora (regression inputs for fixed crashers) are also
  # replayed by the plain `go test ./... -race` step in build-test, so a fixed
  # crasher can never silently regress even outside this job.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.26.6' }
      - name: fuzz untrusted-input parsers (negative control — normal input passes)
        run: |
          set -euo pipefail
          go test ./internal/okf/       -run '^$' -fuzz '^FuzzParseFrontmatter$'   -fuzztime=30s
          go test ./internal/okf/       -run '^$' -fuzz '^FuzzSplitFrontmatterRaw$' -fuzztime=30s
          go test ./internal/okf/       -run '^$' -fuzz '^FuzzLoadBundle$'          -fuzztime=30s
          go test ./internal/apiserver/ -run '^$' -fuzz '^FuzzSearchQueryParams$'   -fuzztime=30s
          go test ./internal/apiserver/ -run '^$' -fuzz '^FuzzCanonicalizeQuery$'   -fuzztime=30s
      - name: positive control — a guaranteed crasher MUST fail the fuzz gate
        run: |
          # The fuzzcontrol-tagged FuzzPositiveControl always crashes. If the
          # fuzz command does NOT exit non-zero, the gate is broken (it would
          # green-light real crashers), so a zero exit here fails CI on purpose.
          if go test -tags fuzzcontrol ./internal/okf/ -run '^$' -fuzz '^FuzzPositiveControl$' -fuzztime=10s; then
            echo "::error::fuzz gate did not fail on a guaranteed crasher — the fuzz gate is broken"
            exit 1
          fi
          echo "positive control failed as required — the fuzz gate catches crashers"

  # Gates the Astro site build. The site's prebuild templates content out of
  # ../docs, so a docs change can break the build too — both paths are filtered
  # by the `changes` job. This job ALWAYS runs so it can be a required status
  # check; on a PR that touches neither site/ nor docs/, it is a fast no-op.
  site:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: no site/docs changes — skipping build
        if: needs.changes.outputs.site != 'true'
        run: echo "No site/** or docs/** changes in this PR; nothing to build."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.site == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.site == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: needs.changes.outputs.site == 'true'
        with:
          python-version: '3.12'
      - name: install
        if: needs.changes.outputs.site == 'true'
        run: npm ci --prefix site
      - name: build and test
        # `npm test` chains the build, then asserts on the built HTML in dist/:
        # clean URLs, no _generated links, and the social-card/icon tags. Those
        # regressions produce a clean, green build — the assertions are the only
        # thing that catches them, so running the build alone would leave the
        # guards in the repo but not in CI.
        if: needs.changes.outputs.site == 'true'
        run: npm test --prefix site
      - name: prose gate — the scanner's own tests
        # Prove the gate itself works before trusting its verdict on the site:
        # the tests assert the negative-listing cadence fails in meta/body/footer
        # prose (the class that shipped to okfctl.dev twice) AND that the same
        # facts in the <span> spec-chip row pass. Stdlib only — no pip install.
        if: needs.changes.outputs.site == 'true'
        run: python3 -m unittest discover -s site/scripts -p '*_test.py' -v
      - name: prose gate — scan the BUILT pages
        # Runs against site/dist/**/*.html, not the source, because the tell has
        # twice hidden in <meta>/<og>/footer copy that only exists after render —
        # the exact class a source-level or body-only scan cannot see. A finding
        # fails the build; the fix is to rewrite the flagged prose to plain
        # positive statements with every technical fact preserved.
        if: needs.changes.outputs.site == 'true'
        run: python3 site/scripts/scan_page_prose.py $(find site/dist -name '*.html')

  # Gates the SHIPPED Markdown prose against the SAME negative-listing cadence the
  # site gate catches in rendered HTML. WHY THIS EXISTS, and why it is separate
  # from the site job: the site gate scans site/dist/**/*.html, so it never saw
  # the README — a .md that ships straight to readers on GitHub. The README's
  # line 30 once read "no CGO, no Python, and no model runtime", the precise
  # cadence the gate exists to block, and CI stayed green because that surface was
  # not HTML in site/dist. The gate guarded one door while the same defect walked
  # through another. This closes it: the ONE detector in scan_page_prose.py now
  # runs against the Markdown prose surfaces this repo ships, via a Markdown front
  # end (extract_prose_markdown) that shares the pattern set — it is not a forked
  # copy. Internal, unpublished Markdown (docs/PRD.md, docs/adr/, docs/plans/,
  # docs/specs/, testdata/) is deliberately excluded: fixture prose, not reader
  # copy, and gating it would train everyone to ignore the check.
  #
  # ALWAYS runs so it can be a required status check; on a PR that touches none of
  # the prose surfaces (nor the scanner) it is a fast no-op. Stdlib-only Python,
  # no pip install and no network — the same hermetic bar the site prose gate holds.
  prose:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: no prose changes — skipping
        if: needs.changes.outputs.prose != 'true' && github.ref != 'refs/heads/main'
        run: echo "No prose surfaces or scanner changed in this PR; nothing to scan."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.prose == 'true' || github.ref == 'refs/heads/main'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: needs.changes.outputs.prose == 'true' || github.ref == 'refs/heads/main'
        with:
          python-version: '3.12'
      - name: prose gate — the scanner's own tests (asserts BOTH controls)
        # Prove the gate works before trusting its verdict on the corpus: the
        # tests assert the negative-listing cadence FAILS in a Markdown prose
        # block (the README hole) AND that a legitimate look-alike PASSES — the
        # same facts as discrete bullets, or inside a fenced code block. The
        # negative control is the load-bearing half; a gate that fires on a
        # bulleted spec list is a nuisance that gets disabled. Stdlib only.
        if: needs.changes.outputs.prose == 'true' || github.ref == 'refs/heads/main'
        run: python3 -m unittest discover -s site/scripts -p '*_test.py' -v
      - name: prose gate — scan the shipped Markdown surfaces
        # Scans exactly the reader-facing Markdown: README.md, CONTRIBUTING.md,
        # docs/*.md, docs/guides/*.md, docs/commands/README.md — excluding the
        # internal PRD/adr/plans/specs. A finding fails the build; the fix is to
        # rewrite the flagged prose to a plain positive statement with every
        # technical fact preserved (never to weaken the pattern).
        if: needs.changes.outputs.prose == 'true' || github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          files=$(find README.md CONTRIBUTING.md docs \
                    -type f -name '*.md' \
                    -not -path 'docs/PRD.md' \
                    -not -path 'docs/adr/*' \
                    -not -path 'docs/plans/*' \
                    -not -path 'docs/specs/*')
          echo "Scanning:"; echo "$files"
          python3 site/scripts/scan_page_prose.py $files

  # Validates the root plugin.json against the PINNED Agent Plugins 1.0.0 schema
  # URL — the authoritative, network-backed check that complements the offline
  # Go validator in internal/agentplugin (run by build-test). Two controls, both
  # load-bearing:
  #   positive — the committed manifest MUST validate against the pinned schema;
  #   negative — a deliberately malformed fixture MUST be rejected, proving the
  #              gate actually bites (a validator that passes everything is
  #              decoration).
  plugin-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - name: install check-jsonschema
        run: pip install "check-jsonschema==0.35.0"
      - name: positive control — committed plugin.json validates against the pinned 1.0.0 schema
        run: |
          check-jsonschema \
            --schemafile https://agent-plugins.org/schemas/1.0.0/plugin.schema.json \
            plugin.json
      - name: negative control — a malformed manifest MUST be rejected
        run: |
          set +e
          check-jsonschema \
            --schemafile https://agent-plugins.org/schemas/1.0.0/plugin.schema.json \
            internal/agentplugin/testdata/invalid-plugin.json
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::the malformed manifest passed schema validation — the plugin-manifest gate is broken"
            exit 1
          fi
          echo "negative control rejected as required — the schema gate catches malformed manifests"
      - name: set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.26.6' }
      - name: leak gate + offline validator on the packaged artifact
        # The Go suite validates the manifest offline AND runs the leak gate over
        # the packaged skill payload (declared skills resolve to shareable, no
        # undeclared shippable skill hides a migration leak). Keeping it in this
        # job puts the packaging gates in one required check.
        run: go test ./internal/agentplugin/ -race -v

  # Proves the SHIPPED SKILLS work, not just the manifest. Installs the RELEASED
  # binary from the public install path and runs every command the four skills
  # document, end to end. The manifest gate proves plugin.json is well-formed;
  # this catches the failure it cannot see — a skill drifting out of sync with
  # the CLI (a renamed/removed subcommand, a changed invocation form) while the
  # manifest stays byte-identical and green.
  #
  # This ALWAYS runs so it can be a required status check; on a PR touching
  # neither skills/ nor cmd/ (nor this job's own inputs) it is a fast no-op. On
  # main it always does the real work. It installs the RELEASED artifact (never a
  # local `go build`, which would hide a packaging break) and resolves the LATEST
  # release at job time (never a hardcoded version, so it keeps testing what users
  # actually install). The runner's own negative control (--self-test) proves the
  # job can fail before it is trusted to pass.
  skill-contract:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: no skills/cmd changes — skipping
        if: needs.changes.outputs.skills != 'true' && github.ref != 'refs/heads/main'
        run: echo "No skills/**, cmd/**, or contract inputs changed in this PR; nothing to run."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.skills == 'true' || github.ref == 'refs/heads/main'
      - name: install the released binary from the public path
        if: needs.changes.outputs.skills == 'true' || github.ref == 'refs/heads/main'
        # The public install path resolves the latest release, verifies the
        # archive against its checksums, and installs okfctl + okfctl-search.
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://okfctl.dev/install.sh | OKFCTL_BIN_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: run the skill-command contract (self-test + existence sweep + workflows)
        if: needs.changes.outputs.skills == 'true' || github.ref == 'refs/heads/main'
        run: bash scripts/skill-command-contract.sh
